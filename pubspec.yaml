name: toriverse
description: "じっくり読み合い、同時公開の瞬間にドキドキする3色オセロ"
publish_to: 'none'

version: 0.1.0+2

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # 状態管理
  riverpod: ^2.4.0
  flutter_riverpod: ^2.4.0

  # Firebase
  firebase_core: ^2.24.0
  cloud_firestore: ^4.14.0
  firebase_auth: ^4.17.0
  firebase_analytics: ^10.8.0
  firebase_crashlytics: ^3.4.0
  firebase_remote_config: ^4.3.0
  firebase_messaging: ^14.7.10

  # プッシュ通知（ローカル表示）
  # >=17.2.1 required: 17.0.0-17.2.0 fail to compile against modern
  # Android SDKs (ambiguous bigLargeIcon(Bitmap|Icon) overload with a
  # null argument); fixed in 17.2.1. No Dart-facing breaking changes
  # since 16.3.x other than compileSdk 34 (already satisfied here).
  flutter_local_notifications: ^17.2.1

  # 認証（OAuth）
  google_sign_in: ^6.1.0
  # >=6.1.1 required: earlier versions' Android Kotlin source still
  # references Flutter's removed v1 plugin embedding (PluginRegistry
  # .Registrar), fixed in 6.1.1 ("Removes references to Flutter v1
  # Android embedding classes"). No Dart-facing breaking changes;
  # this app only uses the stable getAppleIDCredential() API.
  sign_in_with_apple: ^6.1.1

  # 課金・広告
  # >=8.0.0 required: 7.x's Android plugin still references Flutter's
  # v1 plugin embedding (PluginRegistry.Registrar, FlutterNativeView),
  # which the engine has since removed entirely, so it fails to
  # compile. 8.0.0's only breaking change is dropping v1-embedding
  # support natively — no Dart-facing API changes; this app already
  # only uses the stable Purchases/PurchasesConfiguration/CustomerInfo
  # API surface.
  purchases_flutter: ^8.0.0
  # google_mobile_ads is not yet wired into the app (no lib/ usage) and
  # every version's iOS podspec depends on webview_flutter_wkwebview in a
  # way that breaks `pod install` when that plugin is only a transitive
  # dependency (see https://github.com/googleads/googleads-mobile-flutter
  # issues for this exact "Unable to find a specification for
  # `webview_flutter_wkwebview`" error). Re-add when reward-ad
  # integration actually begins.

  # UI・アニメ
  lottie: ^2.6.0
  cached_network_image: ^3.3.0

  # ナビゲーション・ルーティング
  go_router: ^12.1.0

  # 国際化
  intl: ^0.19.0

  # UUID生成
  uuid: ^4.0.0

  # セキュア保存（トークン・認証情報）
  flutter_secure_storage: ^9.0.0

  # SNSシェア
  share_plus: ^7.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0
  # riverpod_generator: ^2.3.0
  # DISABLED: Temporary workaround for riverpod_generator #2766 timeout issue.
  # Once the upstream issue is resolved, re-enable this dependency and restore
  # @riverpod annotations to provider files.

  # テスト
  mockito: ^5.4.0
  mocktail: ^1.0.0
  fake_cloud_firestore: ^2.5.2

flutter:
  uses-material-design: true

  # アセット（アニメーション・フォント等）
  assets:
    - assets/animations/

  # 日本語フォント（オプション）
  # fonts:
  #   - family: CustomFont
  #     fonts:
  #       - asset: assets/fonts/custom_font.ttf
