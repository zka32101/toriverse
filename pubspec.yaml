name: toriverse
description: "じっくり読み合い、同時公開の瞬間にドキドキする3色オセロ"
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # 状態管理
  riverpod: ^2.4.0
  flutter_riverpod: ^2.4.0

  # Firebase
  firebase_core: ^2.24.0
  cloud_firestore: ^4.14.0
  firebase_auth: ^4.17.0
  firebase_analytics: ^10.8.0
  firebase_crashlytics: ^3.4.0
  firebase_remote_config: ^4.3.0

  # 課金・広告
  purchases_flutter: ^7.0.0
  google_mobile_ads: ^3.0.0

  # UI・アニメ
  lottie: ^2.6.0
  cached_network_image: ^3.3.0

  # ナビゲーション・ルーティング
  go_router: ^12.1.0

  # 国際化
  intl: ^0.19.0

  # UUID生成
  uuid: ^4.0.0

  # セキュア保存（トークン・認証情報）
  flutter_secure_storage: ^9.0.0

  # JSONシリアライゼーション
  freezed_annotation: ^2.4.0
  json_annotation: ^4.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0

  # コード生成
  build_runner: ^2.4.0
  freezed: ^2.4.0
  json_serializable: ^6.7.0
  riverpod_generator: ^2.3.0

  # テスト
  mockito: ^5.4.0
  mocktail: ^1.0.0
  fake_cloud_firestore: ^3.0.0
  firebase_core_platform_interface: ^4.14.0

flutter:
  uses-material-design: true

  # 日本語フォント（オプション）
  # assets:
  #   - assets/fonts/
  # fonts:
  #   - family: CustomFont
  #     fonts:
  #       - asset: assets/fonts/custom_font.ttf
