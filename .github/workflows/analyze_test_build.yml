name: Flutter Analyze, Test & Build

on:
  push:
    branches:
      - main
      - claude/triverse-development-r2e05a
  pull_request:
    branches:
      - main
      - claude/triverse-development-r2e05a

jobs:
  analyze:
    name: Analyze Code
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Run code generation
        timeout-minutes: 15
        run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: Analyze code
        run: flutter analyze --no-fatal-infos

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: analyze
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.4.x'
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Run code generation
        timeout-minutes: 15
        run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: Run unit tests
        run: flutter test --coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage/lcov.info
          flags: flutter
          name: codecov-umbrella

      - name: Check coverage threshold
        run: |
          COVERAGE=$(grep -oP 'LF:\K\d+' coverage/lcov.info | awk '{sum+=$1} END {print sum}')
          echo "Coverage lines found: $COVERAGE"
          if [ "$COVERAGE" -lt 50 ]; then echo "Coverage below 50%"; exit 1; fi

  build_android:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '11'
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.4.x'
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Run code generation
        timeout-minutes: 15
        run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: Build APK
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          REVENUCAT_API_KEY: ${{ secrets.REVENUCAT_API_KEY }}
        run: flutter build apk --release --obfuscate --split-debug-info=build/app/outputs/symbols

      - name: Upload APK artifact
        uses: actions/upload-artifact@v3
        with:
          name: app-release.apk
          path: build/app/outputs/flutter-app.apk
          retention-days: 7

  build_ios:
    name: Build iOS IPA
    runs-on: macos-latest
    needs: test
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.4.x'
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Run code generation
        timeout-minutes: 15
        run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: Install CocoaPods
        run: cd ios && pod install --repo-update && cd ..

      - name: Build iOS IPA
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          REVENUCAT_API_KEY: ${{ secrets.REVENUCAT_API_KEY }}
        run: flutter build ios --release --obfuscate --split-debug-info=build/app/outputs/symbols

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v3
        with:
          name: app-release.ipa
          path: build/ios/ipa/
          retention-days: 7

  deploy_testflight:
    name: Deploy to TestFlight
    runs-on: macos-latest
    needs: build_ios
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.4.x'
          channel: stable
          cache: true

      - name: Download IPA artifact
        uses: actions/download-artifact@v3
        with:
          name: app-release.ipa

      - name: Deploy to TestFlight
        env:
          APPLE_DEVELOPER_CERTIFICATE_ID: ${{ secrets.APPLE_DEVELOPER_CERTIFICATE_ID }}
          APPLE_DEVELOPER_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_CERTIFICATE_PASSWORD }}
          APPLE_DEVELOPER_TEAM_ID: ${{ secrets.APPLE_DEVELOPER_TEAM_ID }}
          FASTLANE_USER: ${{ secrets.FASTLANE_USER }}
          FASTLANE_PASSWORD: ${{ secrets.FASTLANE_PASSWORD }}
        run: |
          cd ios
          fastlane beta
          cd ..

  deploy_firebase:
    name: Deploy to Firebase App Distribution
    runs-on: ubuntu-latest
    needs: build_android
    if: github.ref == 'refs/heads/claude/triverse-development-r2e05a' && github.event_name == 'push'
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.4.x'
          channel: stable
          cache: true

      - name: Download APK artifact
        uses: actions/download-artifact@v3
        with:
          name: app-release.apk

      - name: Upload to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID_ANDROID }}
          serviceCredentialsFile: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          file: app-release.apk
          releaseNotes: "Development build - ${{ github.sha }}"
          testers: ${{ secrets.FIREBASE_TESTERS }}
